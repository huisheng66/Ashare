<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />

<title>Wiki 阅读器原型 · Ashare</title>
<style>
  :root {
    --background: oklch(0.984 0.004 85);
    --card: oklch(1 0 0);
    --muted: oklch(0.955 0.006 85);
    --accent: oklch(0.94 0.007 85);
    --foreground: oklch(0.205 0.012 60);
    --muted-foreground: oklch(0.47 0.012 70);
    --border: oklch(0.91 0.006 80);
    --brand: oklch(0.55 0.2 33);
    --brand-soft: oklch(0.55 0.2 33 / 0.08);
    --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI Variable Text", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --radius-md: 8px;
    --radius-lg: 10px;
    --radius-2xl: 18px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    background: var(--background);
    color: var(--foreground);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }

  /* ---------- 顶栏 ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: 16px;
    height: 56px; padding: 0 20px;
    background: color-mix(in oklch, var(--background) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .logo { display: flex; align-items: baseline; gap: 8px; font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }
  .logo span { font-size: 12px; font-weight: 400; color: var(--muted-foreground); }
  .topnav { display: flex; gap: 2px; margin-left: 8px; }
  .topnav a {
    padding: 6px 10px; border-radius: var(--radius-md);
    font-size: 14px; color: var(--muted-foreground); text-decoration: none;
  }
  .topnav a.on { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
  .spacer { flex: 1; }

  /* 移动端目录开关 */
  .drawer-btn {
    display: none; align-items: center; gap: 6px;
    padding: 6px 11px; font-size: 13px; font-family: inherit;
    border: 1px solid var(--border); border-radius: var(--radius-md);
    background: var(--card); color: var(--foreground); cursor: pointer;
  }

  /* ---------- 三栏 ---------- */
  .wrap {
    display: grid;
    grid-template-columns: 232px minmax(0, 1fr) 208px;
    gap: 40px;
    max-width: 1360px;
    margin: 0 auto;
    padding: 28px 24px 72px;
    align-items: start;
  }

  /* 左侧文件树 */
  .sidebar { position: sticky; top: 84px; }
  .tree-title {
    font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--muted-foreground);
    margin: 0 0 10px 10px;
  }
  .tree { border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--card); padding: 6px; }
  .tree a {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; border-radius: 6px;
    font-size: 14px; text-decoration: none; color: var(--muted-foreground);
    cursor: pointer;
  }
  .tree a:hover { background: var(--muted); color: var(--foreground); }
  .tree a.on { background: var(--brand-soft); color: var(--brand); font-weight: 600; box-shadow: inset 2px 0 0 var(--brand); }
  .tree a .ficon { width: 14px; height: 14px; flex-shrink: 0; opacity: 0.55; }
  .tree a.on .ficon { opacity: 1; }
  .tree-foot {
    margin-top: 10px; padding: 0 10px; font-size: 12px; color: var(--muted-foreground);
  }

  /* 中间正文 */
  .doc { min-width: 0; }
  .crumbs { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted-foreground); margin-bottom: 14px; }
  .crumbs code { font-family: var(--font-mono); font-size: 12px; background: var(--muted); padding: 1px 6px; border-radius: 5px; }
  h1 { font-size: 34px; line-height: 1.2; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 14px; }
  .lede { font-size: 16px; line-height: 1.75; color: var(--muted-foreground); margin: 0 0 22px; padding-bottom: 22px; border-bottom: 1px solid var(--border); }

  .doc h2 {
    font-size: 21px; font-weight: 700; letter-spacing: -0.01em;
    margin: 40px 0 0; padding-top: 4px; scroll-margin-top: 76px;
  }
  .doc h2 .anchor {
    margin-left: 9px; font-size: 15px; color: var(--muted-foreground);
    text-decoration: none; opacity: 0; font-weight: 400;
    transition: opacity 0.15s;
  }
  .doc h2:hover .anchor { opacity: 1; }
  .doc h3 { font-size: 17px; font-weight: 600; margin: 28px 0 0; scroll-margin-top: 76px; }
  .doc p { margin: 14px 0; line-height: 1.85; }
  .doc ul, .doc ol { margin: 14px 0; padding-left: 22px; }
  .doc li { margin: 7px 0; line-height: 1.75; }
  .doc ul ul { margin: 6px 0; }
  .doc code {
    font-family: var(--font-mono); font-size: 13px;
    background: var(--muted); border: 1px solid var(--border);
    padding: 1.5px 5px; border-radius: 5px;
  }
  .doc pre {
    margin: 16px 0; padding: 14px 16px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius-2xl); overflow-x: auto;
  }
  .doc pre code { background: none; border: none; padding: 0; font-size: 12.5px; line-height: 1.7; }
  .doc blockquote {
    margin: 16px 0; padding: 2px 0 2px 16px;
    border-left: 2px solid var(--brand); color: var(--muted-foreground);
  }
  .doc blockquote p { margin: 8px 0; }
  .tbl-wrap { margin: 16px 0; overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--card); }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font-weight: 600; padding: 9px 13px; background: var(--muted); border-bottom: 1px solid var(--border); white-space: nowrap; }
  td { padding: 9px 13px; border-bottom: 1px solid var(--border); vertical-align: top; line-height: 1.65; }
  tr:last-child td { border-bottom: none; }
  .ilink { color: var(--brand); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
  .ext { color: var(--muted-foreground); text-decoration: underline; text-underline-offset: 3px; }
  .ext::after { content: "↗"; font-size: 10px; margin-left: 2px; vertical-align: 1px; }

  /* 右侧页内目录 */
  .toc { position: sticky; top: 84px; max-height: calc(100vh - 110px); overflow-y: auto; }
  .toc-title { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted-foreground); margin: 0 0 10px; }
  .toc a {
    display: block; padding: 4px 10px; border-left: 2px solid var(--border);
    font-size: 13px; line-height: 1.5; color: var(--muted-foreground);
    text-decoration: none;
  }
  .toc a:hover { color: var(--foreground); }
  .toc a.on { color: var(--brand); border-left-color: var(--brand); font-weight: 600; }
  .toc a.lv3 { padding-left: 20px; font-size: 12.5px; }

  /* 上下篇 */
  .pager { display: flex; gap: 12px; margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--border); }
  .pager a {
    flex: 1; padding: 12px 14px; border: 1px solid var(--border);
    border-radius: var(--radius-lg); background: var(--card); text-decoration: none;
  }
  .pager a:hover { border-color: var(--muted-foreground); }
  .pager .dir { font-size: 11.5px; color: var(--muted-foreground); }
  .pager .ttl { font-size: 14px; font-weight: 600; margin-top: 2px; }
  .pager .next { text-align: right; }

  /* 原型说明条 */
  .note {
    max-width: 1360px; margin: 20px auto 0; padding: 0 24px;
  }
  .note-inner {
    display: flex; gap: 10px; flex-wrap: wrap;
    padding: 12px 16px; border-radius: var(--radius-lg);
    background: var(--brand-soft); border: 1px solid color-mix(in oklch, var(--brand) 22%, transparent);
    font-size: 13px; color: var(--foreground);
  }
  .note-inner b { color: var(--brand); }

  @media (max-width: 1100px) {
    .wrap { grid-template-columns: 200px minmax(0, 1fr); gap: 28px; }
    .toc { display: none; }
  }
  @media (max-width: 760px) {
    .wrap { grid-template-columns: minmax(0, 1fr); padding: 20px 16px 60px; }
    .sidebar {
      position: fixed; inset: 0 auto 0 0; z-index: 40; width: 264px;
      background: var(--background); border-right: 1px solid var(--border);
      padding: 20px 16px; overflow-y: auto;
      transform: translateX(-100%); transition: transform 0.22s var(--ease-soft, ease);
    }
    .sidebar.open { transform: none; }
    .drawer-btn { display: inline-flex; }
    .topnav { display: none; }
    h1 { font-size: 27px; }
    .scrim { position: fixed; inset: 0; z-index: 35; background: oklch(0.2 0 0 / 0.35); }
  }
</style>
</head>

<h2 id="五分钟上手">五分钟上手</h2>
<pre><code>npm ci
cp .env.example .env.local          # PowerShell: Copy-Item .env.example .env.local
npm run admin:password              # 隐藏输入，生成 ADMIN_PASSWORD_HASH

</ul>
<h2 id="核心文档地图">核心文档地图</h2>
<div class="tbl-wrap"><table><thead><tr><th>文件</th><th>定位</th></tr></thead><tbody>
<tr><td><code>README.md</code></td><td>最完整的一份：开发、内容管理、安全、部署、脚本表</td></tr>

<ul>
<li>代码知识图谱：<code>graphify-out/graph.json</code>（1361 节点 / 3650 边，tree-sitter AST 提取），可用 <code>graphify query "&lt;问题&gt;"</code> 查询。</li>

</ul>`
  },
  "architecture": {
    file: "architecture.md",
    lede: "代码怎么分层、一个请求从边缘到数据库要经过哪些环节。",
    body: `
<blockquote><p>来源：代码通读 + graphify AST 图谱（<code>graphify-out/graph.json</code>，1361 节点 / 3650 边 / 88 社区，commit <code>e9b19a20</code>）。</p></blockquote>
<h2 id="分层">分层</h2>
<pre><code>app/            路由层：页面（Server Components）+ Server Actions，不放业务逻辑
components/     展示层：33 个业务组件 + 22 个 shadcn/ui（components/ui/）
lib/            领域层：38 个模块，无 React 依赖，可单测；带 "server-only" 标记
data/           契约层：类型定义、场景表、种子数据、本地运行库与品牌图标
scripts/        运维层：19 个 .mjs 脚本，与 lib 共用约定（_shared.mjs）
db/migrations/  数据库结构：5 个有序 SQL 迁移
tests/          回归测试：27 个 node:test 文件
proxy.ts        边缘中间件：CSP nonce、/admin 方法白名单</code></pre>
<p>图谱验证的特征：<strong>lib 层模块间调用极少</strong>（生产模块 CALLS 出边普遍 ≤2），模块之间靠数据传递而非函数嵌套——这是"lib 是无 React 的纯逻辑层"的直接证据。</p>
<h2 id="关键抽象">关键抽象（graphify "God Nodes"，按连接数排序）</h2>
<div class="tbl-wrap"><table><thead><tr><th>节点</th><th>边数</th><th>为什么重要</th></tr></thead><tbody>
<tr><td><code>Button()</code></td><td>52</td><td>全站 UI 底座（components/ui/button.tsx）</td></tr>
<tr><td><code>getPool()</code></td><td>29</td><td>MySQL 连接池唯一入口（lib/db.ts），所有 SQL 读写经由它</td></tr>
<tr><td><code>CatalogBrowser()</code></td><td>26</td><td>前台目录页核心交互组件</td></tr>
<tr><td><code>mysqlDriver()</code></td><td>24</td><td>存储门面的驱动开关，决定走 MySQL 还是 JSON</td></tr>
</tbody></table></div>
<h2 id="一个请求的生命周期">一个请求的生命周期</h2>
<h3 id="公开页面">公开页面（如 <code>/software/[slug]</code>）</h3>
<ol>
<li><code>proxy.ts</code> 边缘运行：注入每请求 CSP nonce、基础安全响应头。</li>
<li>页面以 <code>generateMetadata</code> 出 SEO 元数据。</li>
<li>经 <code>lib/catalog.ts</code>（React <code>cache()</code> 包裹）→ <code>lib/store.ts</code> 门面 → <code>mysqlDriver()</code> 为真 → SQL 组装 → <code>lib/db.ts</code> 连接池。</li>
<li>正文与教程由 <code>lib/markdown.ts</code>（自研解析器）渲染为纯文本分块——<strong>不解析 HTML，无存储型 XSS</strong>。</li>
</ol>
<h2 id="目录速查">目录速查</h2>
<div class="tbl-wrap"><table><thead><tr><th>路径</th><th>内容</th></tr></thead><tbody>
<tr><td><code>app/admin/*</code></td><td>后台：登录、条目列表/表单、inbox、clicks</td></tr>
<tr><td><code>lib/catalog*.ts</code></td><td>读路径四件套：缓存门面 / SQL 组装 / 行组装 / 筛选解析</td></tr>
<tr><td><code>data/store/</code></td><td>JSON 运行库与点击日志（0600，不进 git）</td></tr>
</tbody></table></div>
<h2 id="设计决策与理由">设计决策与理由</h2>
<ul>
<li><strong>默认值即决定</strong>：<code>mysqlDriver()</code> 用 <code>!== "json"</code> 而非 <code>=== "mysql"</code>——忘了配置就静默退回 JSON 是最隐蔽的生产事故。</li>
<li><strong>不是双写</strong>：同一时刻只有一个驱动生效，数据库是唯一事实源。</li>
<li><strong>避免重型依赖</strong>：markdown 子集解析器、SigV4 S3 客户端、迁移器全部自研，运行时依赖仅 12 个。</li>
<li><strong>权限判断集中在一张纯函数表</strong>——散落在各 server action 里最容易"新入口忘检查"。</li>
</ul>`
  },

<h2 id="两种驱动">两种驱动</h2>
<p>存储门面 <code>lib/store.ts</code> 按 <code>STORE_DRIVER</code> 选择实现，<strong>同一时刻只有一个生效</strong>。</p>

<blockquote><p>上面这段是<strong>二级嵌套列表</strong>的实测样例 —— 现有解析器会把缩进项直接break 掉，内容并进父项。加了嵌套支持后才是原意。</p></blockquote>
<h2 id="核心表">核心表</h2>
<div class="tbl-wrap"><table><thead><tr><th>表</th><th>作用</th></tr></thead><tbody>

  },
  "frontend": {
    file: "frontend.md",
    lede: "公开页面、搜索筛选、以及 SEO 的实现要点。",
    body: `

const ORDER = ["Home","architecture","data-and-storage","frontend","admin","security","operations","testing"];
const TITLES = {
  "Home": "Ashare Wiki 首页",
  "architecture": "架构总览",
  "data-and-storage": "数据与存储",
  "frontend": "前台",
  "admin": "后台管理",
  "security": "安全机制",
  "operations": "脚本与运维",
  "testing": "测试与验证"
};

const FILE_ICON = '<svg class="ficon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M9 1.5H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V5.5L9 1.5Z"/><path d="M9 1.5v4h4"/></svg>';

let current = "Home";

function renderTree() {
  document.getElementById("tree").innerHTML = ORDER.map(k => `
    <a data-key="${k}" class="${k === current ? "on" : ""}">
      ${FILE_ICON}<span>${k === "Home" ? "Home" : TITLES[k]}</span>
    </a>`).join("");
  document.querySelectorAll("#tree a").forEach(a => {
    a.onclick = () => { location.hash = a.dataset.key; };
  });
}

function renderTOC() {
  const doc = document.getElementById("doc");
  const hs = [...doc.querySelectorAll("h2[id], h3[id]")];
  /* 目录文字取首个文本节点：h2 里挂着一个 hover 才显形的 "#" 锚点，
     读 textContent 会把它一起带进来，标题后就多出一个尾巴。 */
  document.getElementById("tocList").innerHTML = hs.map(h => {
    const label = (h.firstChild?.textContent ?? h.textContent).trim();
    return `<a href="#${h.id}" class="${h.tagName === "H3" ? "lv3" : ""}" data-toc="${h.id}">${label}</a>`;
  }).join("");
  document.querySelectorAll("#tocList a").forEach(a => {
    a.onclick = e => {
      e.preventDefault();
      document.getElementById(a.dataset.toc)?.scrollIntoView({ block: "start" });
    };
  });
  // 滚动高亮
  const links = [...document.querySelectorAll("#tocList a")];
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      links.forEach(l => l.classList.toggle("on", l.dataset.toc === en.target.id));
    });
  }, { rootMargin: "-80px 0px -70% 0px" });
  hs.forEach(h => io.observe(h));
}

function render(key) {
  current = key;
  const d = DOCS[key];
  const i = ORDER.indexOf(key);
  const prev = i > 0 ? ORDER[i-1] : null;
  const next = i < ORDER.length-1 ? ORDER[i+1] : null;

  document.getElementById("doc").innerHTML = `
    <div class="crumbs"><code>docs/wiki/${d.file}</code></div>
    <h1>${TITLES[key]}</h1>
    <p class="lede">${d.lede}</p>
    ${d.body}
    <div class="pager">
      ${prev ? `<a href="#" data-go="${prev}"><div class="dir">← 上一页</div><div class="ttl">${prev === "Home" ? "Home" : TITLES[prev]}</div></a>` : "<span style='flex:1'></span>"}
      ${next ? `<a href="#" data-go="${next}" class="next"><div class="dir">下一页 →</div><div class="ttl">${TITLES[next]}</div></a>` : "<span style='flex:1'></span>"}
    </div>`;

  // h2 锚点
  document.querySelectorAll("#doc h2[id]").forEach(h => {
    const a = document.createElement("a");
    a.className = "anchor"; a.href = "#" + h.id; a.textContent = "#";
    h.appendChild(a);
  });
  // 正文内互链
  document.querySelectorAll("#doc a[data-goto]").forEach(a => {
    a.onclick = e => { e.preventDefault(); location.hash = a.dataset.goto; };
  });
  document.querySelectorAll("#doc .pager a").forEach(a => {
    a.onclick = e => { e.preventDefault(); location.hash = a.dataset.go; };
  });

  renderTree();
  renderTOC();
  closeDrawer();
  window.scrollTo(0, 0);
}

function openDrawer() {
  document.getElementById("sidebar").classList.add("open");
  let s = document.getElementById("scrim");
  if (!s) { s = document.createElement("div"); s.id = "scrim"; s.className = "scrim";
    s.onclick = closeDrawer; document.body.appendChild(s); }
}
function closeDrawer() {
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("scrim")?.remove();
}
document.getElementById("drawerBtn").onclick = openDrawer;

function fromHash() {
  const k = location.hash.slice(1);
  render(DOCS[k] ? k : "Home");
}
window.addEventListener("hashchange", fromHash);
fromHash();
</script>
